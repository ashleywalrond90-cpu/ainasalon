<script>

/* ---------- Menu dropdown (unchanged) ---------- */
const navToggle = document.getElementById('navToggle');
const navDropdown = document.getElementById('navDropdown');
if (navToggle && navDropdown) {
  navToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    navDropdown.classList.toggle('open');
    navToggle.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!navDropdown.contains(e.target) && e.target !== navToggle) {
      navDropdown.classList.remove('open');
      navToggle.classList.remove('open');
    }
  });
}

/* ---------- Services page ---------- */
(function () {
  var root = document.getElementById('servicesRoot');
  var navInner = document.getElementById('catNavInner');
  var header = document.querySelector('header');

  function setHeaderHeight() {
    if (header) {
      document.documentElement.style.setProperty('--header-h', header.getBoundingClientRect().height + 'px');
    }
  }
  setHeaderHeight();
  window.addEventListener('resize', setHeaderHeight);
  window.addEventListener('load', setHeaderHeight);

  if (typeof services === 'undefined' || !services.length) {
    var msg = document.createElement('p');
    msg.className = 'services-empty';
    msg.textContent = 'Our services are being updated. Please check back shortly.';
    root.appendChild(msg);
    return;
  }

  var fallbackLink = (typeof DEFAULT_BOOKING_LINK !== 'undefined') ? DEFAULT_BOOKING_LINK : '#';

  function slugify(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  function formatDuration(mins) {
    if (!mins) return '';
    var h = Math.floor(mins / 60);
    var m = mins % 60;
    var out = [];
    if (h) out.push(h + (h === 1 ? ' hr' : ' hrs'));
    if (m) out.push(m + ' min');
    return out.join(' ');
  }

  function formatPrice(price, note) {
    if (price === null || price === undefined || price === '') return '';
    if (price === 0) return 'Complimentary';
    return 'BBD $' + price + (note ? ' ' + note : '');
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // Group by category, keeping the order they first appear in services.js
  var order = [];
  var groups = {};
  services.forEach(function (s) {
    if (!groups[s.category]) { groups[s.category] = []; order.push(s.category); }
    groups[s.category].push(s);
  });

  order.forEach(function (cat) {
    var id = slugify(cat);

    var link = el('a', '', cat);
    link.href = '#' + id;
    link.setAttribute('data-target', id);
    navInner.appendChild(link);

    var section = el('section', 'cat-section');
    section.id = id;
    section.appendChild(el('h2', 'cat-title', cat));

    groups[cat].forEach(function (s) {
      var row = el('article', 'service');

      var head = el('div', 'service-head');
      head.appendChild(el('h3', 'service-name', s.name));

      var metaParts = [formatDuration(s.duration), formatPrice(s.price, s.priceNote)].filter(Boolean);
      if (metaParts.length) {
        var meta = el('div', 'service-meta');
        metaParts.forEach(function (part, i) {
          if (i) meta.appendChild(el('span', 'dot', '·'));
          meta.appendChild(document.createTextNode(part));
        });
        head.appendChild(meta);
      }
      row.appendChild(head);

      var body = el('div', 'service-body');
      var desc = el('p', 'service-desc', s.description || '');
      body.appendChild(desc);
      if ((s.description || '').length > 180) {
        desc.classList.add('clamped');
        var more = el('button', 'more-btn', 'Read more');
        more.type = 'button';
        more.setAttribute('aria-expanded', 'false');
        more.addEventListener('click', function () {
          var open = desc.classList.toggle('clamped') === false;
          more.textContent = open ? 'Read less' : 'Read more';
          more.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        body.appendChild(more);
      }
      row.appendChild(body);

      if (s.reserve !== false) {
        var cta = el('a', 'reserve', 'Reserve');
        cta.href = s.link || fallbackLink;
        cta.target = '_blank';
        cta.rel = 'noopener';
        cta.setAttribute('aria-label', 'Reserve ' + s.name);
        row.appendChild(cta);
      }

      section.appendChild(row);
    });

    root.appendChild(section);
  });

  var note = el('p', 'rsvp-note', "You'll be taken to our secure scheduling calendar to complete your reservation.");
  root.appendChild(note);

  // Highlight the category currently in view
  var links = navInner.querySelectorAll('a');
  function setActive(id) {
    links.forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('data-target') === id);
    });
  }
  setActive(slugify(order[0]));

  if ('IntersectionObserver' in window) {
    var sections = root.querySelectorAll('.cat-section');
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) setActive(entry.target.id);
      });
    }, { rootMargin: '-35% 0px -55% 0px', threshold: 0 });
    sections.forEach(function (sec) { io.observe(sec); });
  }
})();

</script>

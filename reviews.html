<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reviews — ĀINA</title>
<link rel="icon" type="image/jpeg" href="IMG_0950.jpeg">
<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@400;500&display=swap');

:root {
  --bg: #F7F4EF;
  --ink: #171614;
  --sand: #C9B79C;
  --taupe: #8C8378;
  --line: rgba(23,22,20,0.12);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161512; --ink: #F3EFE6; --sand: #C9B79C; --taupe: #A69C8E;
    --line: rgba(243,239,230,0.14);
  }
}
:root[data-theme="dark"] {
  --bg: #161512; --ink: #F3EFE6; --sand: #C9B79C; --taupe: #A69C8E;
  --line: rgba(243,239,230,0.14);
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}

header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: env(safe-area-inset-top, 0px) 6vw 0;
}
.header-inner {
  max-width: 900px;
  margin: 0 auto;
  padding: 22px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.header-wordmark { height: 28px; width: auto; filter: brightness(0) saturate(100%); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .header-wordmark { filter: brightness(0) saturate(100%) invert(1); }
}
:root[data-theme="dark"] .header-wordmark { filter: brightness(0) saturate(100%) invert(1); }
a.wordmark-link { display: inline-flex; }

.nav-toggle {
  position: absolute;
  left: 0;
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--taupe);
  padding: 6px 0;
  transition: color 0.25s ease;
}
.nav-toggle:hover, .nav-toggle.open { color: var(--ink); }

.nav-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 4px;
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 26px 30px;
  display: none;
  gap: 40px;
  min-width: 320px;
  box-shadow: 0 12px 28px rgba(0,0,0,0.08);
  z-index: 40;
}
.nav-dropdown.open { display: flex; }
.nav-col h4 {
  font-size: 0.64rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--taupe);
  margin: 0 0 12px;
  font-weight: 500;
}
.nav-col a {
  display: block;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.1rem;
  color: var(--ink);
  text-decoration: none;
  margin-bottom: 8px;
  transition: color 0.2s ease;
}
.nav-col a:hover { color: var(--taupe); }
@media (max-width: 480px) {
  .nav-dropdown { min-width: 260px; gap: 26px; padding: 22px 20px; }
}


.nav-dropdown {
  flex-direction: column;
  gap: 16px;
  padding: 22px 30px 26px;
}
.nav-home {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.1rem;
  color: var(--ink);
  text-decoration: none;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
  transition: color 0.2s ease;
}
.nav-home:hover { color: var(--taupe); }
.nav-cols { display: flex; gap: 40px; }
@media (max-width: 480px) { .nav-cols { gap: 26px; } }

.page-intro {
  max-width: 700px;
  margin: 9vh auto 6vh;
  padding: 0 6vw;
  text-align: center;
}
.page-intro h1 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 400;
  font-size: clamp(2.2rem, 5vw, 3.2rem);
  margin: 0 0 14px;
  letter-spacing: 0.02em;
}
.page-intro p {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-style: italic;
  font-size: 1.1rem;
  color: var(--taupe);
  margin: 0;
}

footer.simple {
  border-top: 1px solid var(--line);
  padding: 40px 6vw calc(40px + env(safe-area-inset-bottom, 0px));
  text-align: center;
}
.f-back {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.1rem;
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid var(--taupe);
  padding-bottom: 2px;
  transition: color 0.25s ease;
}
.f-back:hover { color: var(--taupe); }
.f-bottom {
  margin-top: 24px;
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  color: var(--taupe);
}


main.reviews-main {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 6vw;
}
.write-review { border: 1px solid var(--line); padding: 34px; margin-bottom: 6vh; }
.write-review h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-size: 1.4rem; margin: 0 0 22px; text-align: center; }
.stars { display: flex; justify-content: center; gap: 8px; margin-bottom: 22px; font-size: 1.8rem; }
.star { cursor: pointer; color: var(--line); transition: color 0.15s ease; user-select: none; }
.star.filled { color: var(--sand); }
.field { margin-bottom: 20px; }
.field label { display: block; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--taupe); margin-bottom: 8px; }
.field input, .field textarea {
  width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--line);
  color: var(--ink); font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.1rem;
  padding: 8px 2px; outline: none; transition: border-color 0.25s ease; resize: vertical;
}
.field input:focus, .field textarea:focus { border-color: var(--ink); }
.field textarea { min-height: 110px; line-height: 1.6; border: 1px solid var(--line); padding: 14px; border-radius: 2px; }
.field textarea:focus { border-color: var(--ink); }
.submit-btn {
  display: block; margin: 26px auto 0; padding: 14px 42px; border: 1px solid var(--ink);
  background: transparent; color: var(--ink); font-family: 'Inter', sans-serif; font-size: 0.75rem;
  letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; transition: background 0.35s ease, color 0.35s ease;
}
.submit-btn:hover { background: var(--ink); color: var(--bg); }
.submit-btn:disabled { opacity: 0.5; cursor: default; }
.status-msg { text-align: center; margin-top: 16px; font-size: 0.85rem; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; color: var(--taupe); min-height: 1.2em; }

.reviews-heading { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-size: 1.4rem; text-align: center; margin: 0 0 6vh; text-transform: uppercase; letter-spacing: 0.04em; }
.review-list { display: flex; flex-direction: column; }
.review-item { padding: 28px 0; border-top: 1px solid var(--line); }
.review-item:last-child { border-bottom: 1px solid var(--line); }
.review-stars { color: var(--sand); font-size: 1rem; margin-bottom: 10px; letter-spacing: 2px; }
.review-text { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 1.15rem; line-height: 1.6; margin: 0 0 12px; color: var(--ink); }
.review-meta { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--taupe); }
.empty-state { text-align: center; padding: 6vh 0; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; color: var(--taupe); font-size: 1.05rem; }

.manage-row { text-align: center; margin: 6vh 0 4vh; }
.manage-btn {
  background: none; border: 1px solid var(--line); color: var(--taupe); font-family: 'Inter', sans-serif;
  font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 10px 22px; cursor: pointer;
  transition: border-color 0.25s ease, color 0.25s ease;
}
.manage-btn:hover { border-color: var(--ink); color: var(--ink); }
.admin-panel { display: none; border: 1px solid var(--line); padding: 28px; margin-bottom: 6vh; }
.admin-panel.open { display: block; }
.admin-panel h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.2rem; font-weight: 400; margin: 0 0 18px; text-align: center; }
.pending-item { border-top: 1px solid var(--line); padding: 18px 0; }
.pending-item:last-child { border-bottom: 1px solid var(--line); }
.pending-actions { display: flex; gap: 10px; margin-top: 10px; }
.pending-actions button {
  padding: 8px 18px; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase;
  border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer;
  transition: background 0.25s ease, color 0.25s ease;
}
.pending-actions button:hover { background: var(--ink); color: var(--bg); }
.pending-actions .reject-btn { border-color: var(--taupe); color: var(--taupe); }
.pending-actions .reject-btn:hover { background: var(--taupe); color: var(--bg); }
.no-pending { text-align: center; color: var(--taupe); font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; }

</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="nav-toggle-wrap">
      <button class="nav-toggle" id="navToggle" type="button">Menu</button>

      <div class="nav-dropdown" id="navDropdown">
        <a class="nav-home" href="index.html">Home</a>

        
<div class="nav-cols">
  <div class="nav-col">
    <h4>ĀINA Salon</h4>
    <a href="./rsvp.html">RSVP</a>
    <a href="./faq.html">FAQ</a>
  </div>

  <div class="nav-col">
    <h4>ĀINA Shop</h4>
    <a href="./about.html">ĀINA Hair</a>
    <a href="./about.html">ĀINA Products</a>
  </div>
</div>
      </div>
    </div>

    <a class="wordmark-link" href="./index.html">
      <img
        class="header-wordmark"
        src="./logo.png"
        alt="ĀINA"
      >
    </a>
  </div>
</header>

<div class="page-intro">
  <h1>Reviews</h1>
  <p>Hear from our clients — and share your own experience.</p>
</div>

<main class="reviews-main">
<div class="write-review">
    <h2>Leave a Review</h2>
    <div class="stars" id="starPicker">
      <span class="star" data-value="1">&#9733;</span>
      <span class="star" data-value="2">&#9733;</span>
      <span class="star" data-value="3">&#9733;</span>
      <span class="star" data-value="4">&#9733;</span>
      <span class="star" data-value="5">&#9733;</span>
    </div>
    <div class="field"><label for="reviewerName">Name</label><input type="text" id="reviewerName" placeholder="Your name"></div>
    <div class="field"><label for="reviewText">Your Review</label><textarea id="reviewText" placeholder="Tell us about your experience..."></textarea></div>
    <button class="submit-btn" id="submitReview">Submit Review</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <h2 class="reviews-heading">What Clients Are Saying</h2>
  <div class="review-list" id="reviewList">
    <div class="empty-state" id="emptyState">Loading reviews...</div>
  </div>

  <div class="manage-row">
    <button class="manage-btn" id="manageToggle">Manage Reviews</button>
  </div>
  <div class="admin-panel" id="adminPanel">
    <h2>Pending Approval</h2>
    <div id="pendingList"><div class="no-pending">Loading...</div></div>
  </div>
</main>

<footer class="simple">
  <a class="f-back" href="./index.html">Back to home</a>
  <div class="f-bottom">ĀINA — all rights reserved</div>
</footer>

<script>

const navToggle = document.getElementById('navToggle');
const navDropdown = document.getElementById('navDropdown');
if (navToggle && navDropdown) {
  navToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    navDropdown.classList.toggle('open');
    navToggle.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!navDropdown.contains(e.target) && e.target !== navToggle) {
      navDropdown.classList.remove('open');
      navToggle.classList.remove('open');
    }
  });
}


const ADMIN_CODE = "ainaadmin";
const SEED_REVIEWS = [{"name": "Dominic B", "rating": 5, "text": "A-class service.", "ts": 1761575474774, "status": "approved"}, {"name": "Chinara O", "rating": 5, "text": "My favorite stylist", "ts": 1727015474774, "status": "approved"}, {"name": "Nya B", "rating": 5, "text": "10/10, would always recommend! 🤩", "ts": 1726583474774, "status": "approved"}, {"name": "Gabrielle P", "rating": 5, "text": "Great stylist! Very satisfied, will definitely return. She is dedicated to customer service.", "ts": 1726151474774, "status": "approved"}, {"name": "Akia S", "rating": 5, "text": "Love my girl❤️", "ts": 1725719474774, "status": "approved"}, {"name": "Christina M", "rating": 5, "text": "Service is great as always 10/10, I would recommend her to everyone. I will definitely be a consistent client ☺️", "ts": 1695479474774, "status": "approved"}];
let dbRef = null;
let selectedRating = 0;

const stars = document.querySelectorAll('.star');
stars.forEach(star => {
  star.addEventListener('click', () => {
    selectedRating = parseInt(star.dataset.value);
    updateStars();
  });
});
function updateStars() {
  stars.forEach(star => { star.classList.toggle('filled', parseInt(star.dataset.value) <= selectedRating); });
}

function renderApproved(reviews) {
  const list = document.getElementById('reviewList');
  const approved = (reviews||[]).filter(r => r.status === 'approved');
  if (approved.length === 0) {
    list.innerHTML = '<div class="empty-state">Be the first to leave a review.</div>';
    return;
  }
  const sorted = [...approved].sort((a,b) => (b.ts||0) - (a.ts||0));
  list.innerHTML = sorted.map(r => {
    const starStr = '&#9733;'.repeat(r.rating||5) + '&#9734;'.repeat(5-(r.rating||5));
    const name = (r.name || 'Anonymous').replace(/</g,'&lt;');
    const text = (r.text || '').replace(/</g,'&lt;');
    const date = r.ts ? new Date(r.ts).toLocaleDateString('en-US', {month:'long', year:'numeric'}) : '';
    return `<div class="review-item">
      <div class="review-stars">${starStr}</div>
      <p class="review-text">"${text}"</p>
      <div class="review-meta">${name}${date ? ' \u00b7 ' + date : ''}</div>
    </div>`;
  }).join('');
}

function renderPending(reviews) {
  const wrap = document.getElementById('pendingList');
  const pending = (reviews||[]).filter(r => r.status === 'pending');
  if (pending.length === 0) {
    wrap.innerHTML = '<div class="no-pending">No reviews waiting for approval.</div>';
    return;
  }
  const sorted = [...pending].sort((a,b) => (a.ts||0) - (b.ts||0));
  wrap.innerHTML = sorted.map(r => {
    const name = (r.name||'Anonymous').replace(/</g,'&lt;');
    const text = (r.text||'').replace(/</g,'&lt;');
    return `<div class="pending-item" data-id="${r.id}">
      <div class="review-stars">${'&#9733;'.repeat(r.rating||5)}</div>
      <p class="review-text">"${text}"</p>
      <div class="review-meta">${name}</div>
      <div class="pending-actions">
        <button class="approve-btn" data-id="${r.id}">Approve</button>
        <button class="reject-btn" data-id="${r.id}">Reject</button>
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.approve-btn').forEach(b => b.addEventListener('click', () => setStatus(b.dataset.id, 'approved')));
  document.querySelectorAll('.reject-btn').forEach(b => b.addEventListener('click', () => setStatus(b.dataset.id, 'rejected')));
}

async function setStatus(id, status) {
  if (!dbRef) return;
  try {
    const existing = await dbRef.doc('reviews/' + id).get();
    const data = existing.data ? existing.data() : existing;
    await dbRef.doc('reviews/' + id).set({ ...data, status });
    loadAll();
  } catch (e) { console.error(e); }
}

async function initDb() {
  try { dbRef = await claude.use('db'); } catch (e) { dbRef = null; }
  if (!dbRef) {
    document.getElementById('emptyState').textContent = 'Reviews are temporarily unavailable.';
    return;
  }
  await seedIfEmpty();
  loadAll();
}

async function seedIfEmpty() {
  try {
    const snapshot = await dbRef.collection('reviews').get();
    const existing = snapshot.docs ? snapshot.docs.map(d => d.data()) : [];
    if (existing.length === 0) {
      for (const r of SEED_REVIEWS) {
        const id = 'r_seed_' + Math.random().toString(36).slice(2,10);
        await dbRef.doc('reviews/' + id).set({ ...r, id });
      }
    }
  } catch (e) { console.error('Seeding failed', e); }
}

async function loadAll() {
  try {
    const snapshot = await dbRef.collection('reviews').get();
    const reviews = snapshot.docs ? snapshot.docs.map(d => d.data()) : [];
    renderApproved(reviews);
    renderPending(reviews);
  } catch (e) { console.error(e); }
}

document.getElementById('manageToggle').addEventListener('click', () => {
  const panel = document.getElementById('adminPanel');
  if (panel.classList.contains('open')) { panel.classList.remove('open'); return; }
  const code = prompt('Enter admin passcode to manage reviews:');
  if (code === ADMIN_CODE) { panel.classList.add('open'); loadAll(); }
  else if (code !== null) { alert('Incorrect passcode.'); }
});

document.getElementById('submitReview').addEventListener('click', async () => {
  const name = document.getElementById('reviewerName').value.trim();
  const text = document.getElementById('reviewText').value.trim();
  const statusMsg = document.getElementById('statusMsg');
  if (!text) { statusMsg.textContent = 'Please write a review before submitting.'; return; }
  if (selectedRating === 0) { statusMsg.textContent = 'Please select a star rating.'; return; }
  if (!dbRef) { statusMsg.textContent = 'Reviews are temporarily unavailable.'; return; }

  const btn = document.getElementById('submitReview');
  btn.disabled = true;
  statusMsg.textContent = 'Submitting for approval...';
  try {
    const id = 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    const reviewData = { id, name: name || 'Anonymous', text, rating: selectedRating, ts: Date.now(), status: 'pending' };
    await dbRef.doc('reviews/' + id).set(reviewData);
    statusMsg.textContent = 'Thank you! Your review is awaiting approval before it appears publicly.';
    document.getElementById('reviewerName').value = '';
    document.getElementById('reviewText').value = '';
    selectedRating = 0;
    updateStars();

    const subject = encodeURIComponent('New review pending approval');
    let mailBody = 'A new review was submitted on your website and is awaiting approval.\n\n';
    mailBody += 'Name: ' + (name || 'Anonymous') + '\n';
    mailBody += 'Rating: ' + selectedRatingBackup + '/5\n';
    mailBody += 'Review: ' + text + '\n\n';
    mailBody += 'Visit the Reviews page and click "Manage Reviews" to approve or reject it.';
    window.open('mailto:info@ainasalon.com?subject=' + subject + '&body=' + encodeURIComponent(mailBody), '_blank');

    loadAll();
  } catch (e) {
    statusMsg.textContent = 'Something went wrong. Please try again.';
  } finally {
    btn.disabled = false;
  }
});

let selectedRatingBackup = 0;
stars.forEach(star => { star.addEventListener('click', () => { selectedRatingBackup = selectedRating; }); });

initDb();

</script>

</body>
</html>
